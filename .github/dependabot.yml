# Dependabot version updates. Security updates are enabled separately in
# Settings → Code security (Dependabot alerts + security updates).
version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current; Dependabot
  # updates both the SHA and the "# vX.Y.Z" comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /sage-halpin
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: deps
