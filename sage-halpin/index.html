<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentinel8 — The Evolving Board</title>
    <meta name="description" content="An evolving board of human judgement and AI agents: six perspectives on every decision, with the people accountable for the business deciding." />
    <meta property="og:title" content="Sentinel8 — The Evolving Board" />
    <meta property="og:description" content="The team evolves. The knowledge compounds." />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#13232B" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
      /* Startup: one branded mark until the app and its fonts are ready, then everything at once. */
      .boot { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #F5F1E9; transition: opacity .35s ease, visibility .35s; }
      .boot svg { width: 72px; height: 72px; }
      .boot circle { animation: boot-pulse 1.5s ease-in-out infinite; }
      @keyframes boot-pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
      html.booting #root { opacity: 0; }
      #root { transition: opacity .35s ease; }
      html.booted .boot { opacity: 0; visibility: hidden; }
      @media (prefers-reduced-motion: reduce) { .boot circle { animation: none; opacity: 1; } .boot, #root { transition: none; } }
      @media print { .boot { display: none; } }
    </style>
    <script>document.documentElement.classList.add("booting"); setTimeout(function () { document.documentElement.classList.replace("booting", "booted"); }, 4000);</script>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="boot" role="status" aria-live="polite">
      <svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="20" rx="11.5" ry="7" fill="none" stroke="#13232B" stroke-width="1.6"/><path d="M20 20C18 17.2 13.5 17.2 13.5 20C13.5 22.8 18 22.8 20 20C22 17.2 26.5 17.2 26.5 20C26.5 22.8 22 22.8 20 20Z" fill="none" stroke="#B28A56" stroke-width="1.4"/><circle cx="20" cy="7" r="3" fill="#7FB692"/><circle cx="34" cy="13" r="3" fill="#F2EEE4" stroke="#13232B" stroke-width=".8" style="animation-delay:.25s"/><circle cx="34" cy="27" r="3" fill="#D9A15F" style="animation-delay:.5s"/><circle cx="20" cy="33" r="3" fill="#6FA8D6" style="animation-delay:.75s"/><circle cx="6" cy="27" r="3" fill="#E07F6A" style="animation-delay:1s"/><circle cx="6" cy="13" r="3" fill="#A99BDA" style="animation-delay:1.25s"/></svg>
      <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Loading Sentinel8</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
